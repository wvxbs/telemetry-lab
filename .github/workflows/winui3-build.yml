name: Build Windows app

on:
  push:
    branches:
      - main
      - feature/winui3-shell
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-winui:
    name: Build Windows artifact
    runs-on: windows-latest

    env:
      PROJECT_PATH: winui/TelemetryLab.WinUI/TelemetryLab.WinUI.csproj
      LAUNCHER_PATH: winui/TelemetryLab.Launcher/TelemetryLab.Launcher.csproj
      ARTIFACT_DIR: artifacts/TelemetryLab-WinUI3
      ARTIFACT_NAME: TelemetryLab-WinUI3-windows-x64
      SFX_EXE: artifacts/TelemetryLab-WinUI3-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve signing policy
        shell: pwsh
        run: |
          $require = '${{ github.ref }}' -eq 'refs/heads/main' -or '${{ startsWith(github.ref, 'refs/tags/v') }}' -eq 'true'
          "REQUIRE_CODESIGN=$($require.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
          if ($require) {
            Write-Host "Code signing is required for main/tag Windows artifacts."
          } else {
            Write-Warning "Code signing is optional for this development artifact. Windows may block unsigned executables."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore WinUI project
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Publish WinUI app
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          -c Release
          -r win-x64
          -p:SelfContained=true
          -p:WindowsPackageType=None
          -o "${{ env.ARTIFACT_DIR }}"

      - name: Add install helpers
        shell: pwsh
        run: |
          Copy-Item `
            -LiteralPath "winui\TelemetryLab.WinUI\Packaging\install.ps1", "winui\TelemetryLab.WinUI\Packaging\uninstall.ps1" `
            -Destination "${env:ARTIFACT_DIR}" `
            -Force

      - name: Create launcher payload
        shell: pwsh
        run: |
          $payload = "${env:RUNNER_TEMP}\TelemetryLab.WinUI-payload.zip"
          Compress-Archive `
            -Path "${env:ARTIFACT_DIR}\*" `
            -DestinationPath $payload `
            -CompressionLevel Optimal `
            -Force
          "PAYLOAD_ZIP=$payload" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish single-file launcher
        shell: pwsh
        run: |
          $launcherOut = "${env:RUNNER_TEMP}\telemetry-lab-launcher"
          dotnet publish "${env:LAUNCHER_PATH}" `
            -c Release `
            -r win-x64 `
            -p:SelfContained=true `
            -p:PublishSingleFile=true `
            -p:PayloadZip="${env:PAYLOAD_ZIP}" `
            -o $launcherOut
          Copy-Item -LiteralPath (Join-Path $launcherOut "TelemetryLab.exe") -Destination "${env:SFX_EXE}" -Force

      - name: Sign Windows executables if configured
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          CODESIGN_TIMESTAMP_URL: ${{ vars.CODESIGN_TIMESTAMP_URL }}
        run: |
          $signParams = @{
            ArtifactDir = "${env:ARTIFACT_DIR}"
            AdditionalTargets = @("${env:SFX_EXE}")
          }
          if ("${env:REQUIRE_CODESIGN}" -eq "true") {
            $signParams.RequireCertificate = $true
          }
          ./scripts/sign-windows-artifact.ps1 @signParams

      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          $hashes = @()
          $hashes += Get-FileHash -Algorithm SHA256 -LiteralPath "${env:SFX_EXE}"
          Get-ChildItem -LiteralPath "${env:ARTIFACT_DIR}" -Recurse -File | ForEach-Object {
            $hashes += Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
          }
          $hashes |
            Sort-Object Path |
            ForEach-Object { "$($_.Hash)  $($_.Path)" } |
            Set-Content -LiteralPath "artifacts/${env:ARTIFACT_NAME}.sha256.txt" -Encoding ASCII

      - name: Upload WinUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_DIR }}/**
            artifacts/${{ env.ARTIFACT_NAME }}.sha256.txt

      - name: Upload single-file launcher
        uses: actions/upload-artifact@v4
        with:
          name: TelemetryLab-WinUI3-windows-x64-exe
          path: |
            ${{ env.SFX_EXE }}
            artifacts/${{ env.ARTIFACT_NAME }}.sha256.txt
          if-no-files-found: error

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/feature/winui3-shell'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${env:ARTIFACT_DIR}\*" `
            -DestinationPath "artifacts/${env:ARTIFACT_NAME}.zip" `
            -Force

      - name: Publish public latest WinUI release
        if: github.ref == 'refs/heads/feature/winui3-shell'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: winui-latest
          target_commitish: ${{ github.sha }}
          name: Telemetry Lab WinUI latest
          body: |
            Public WinUI build for people who want to download Telemetry Lab without signing in to GitHub.

            Download `TelemetryLab-WinUI3-windows-x64.exe` for the easiest single-file launcher.
            Download `TelemetryLab-WinUI3-windows-x64.zip` if you prefer the full portable folder.

            This release is updated automatically from `feature/winui3-shell`. It may be unsigned when no Authenticode certificate is configured, so Windows SmartScreen can still warn before running it.
          prerelease: true
          make_latest: false
          files: |
            artifacts/${{ env.ARTIFACT_NAME }}.zip
            ${{ env.SFX_EXE }}
            artifacts/${{ env.ARTIFACT_NAME }}.sha256.txt
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: |
            artifacts/${{ env.ARTIFACT_NAME }}.zip
            ${{ env.SFX_EXE }}
            artifacts/${{ env.ARTIFACT_NAME }}.sha256.txt
